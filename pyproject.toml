[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phronon_common"
# Keep in step with the tag the fleet pins (server-ops/check_common_pin.py
# compares CI, every repo and the server checkout — but none of them reads
# THIS). It sat at 1.9.1 while every consumer pinned v1.13.25, so `pip show`,
# an SBOM or an audit report would have named a version that had not existed
# for weeks (external review, 16 August 2026).
#
# SET IT TO THE TAG YOU ARE ABOUT TO CREATE, not the one that exists: writing
# the current tag here and then tagging the commit that contains it recreates
# the drift immediately, one version smaller.
version = "1.40.0"
description = "Shared framework-agnostic helpers for the Phronon teaching tools"
requires-python = ">=3.10"
dependencies = [
    "itsdangerous>=2.2.0",
]

# `csrf`, `legal`, `rate_limit` and `security_headers` import FastAPI, Starlette
# and Jinja2 — the package claimed only itsdangerous until 4 September 2026, so
# `pip install phronon_common` in a bare environment produced a package that
# could not import four of its modules and said nothing. They are an EXTRA
# rather than a core dependency because the other thirty modules are genuinely
# framework-agnostic, and the test kit is imported by scripts that have no web
# stack at all. Every consumer installs `phronon_common[web]`.
[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "jinja2>=3.1",
]
# `twofactor.qr_svg()` draws the enrolment QR if qrcode is installed and returns
# "" if it is not — the setup key can always be typed by hand, which is the
# documented fallback. Declared so the option is visible rather than folklore.
qr = [
    "qrcode>=7.4",
]

[tool.setuptools]
packages = ["phronon_common", "phronon_common.testing"]
package-dir = { "phronon_common" = ".", "phronon_common.testing" = "testing" }
# The subpackage needs its OWN package-dir entry. With only the root
# mapping above, `pip wheel` built a wheel with no phronon_common/testing
# in it at all and said nothing — the tools would have imported the test
# kit from the sibling checkout locally and failed in CI, which installs
# from the tag. Verified by unzipping the wheel, not by reading this.

[tool.setuptools.package-data]
# The shared legal pages render from these Jinja partials; a pip install
# without them (CI) would make every tool's legal tests fail on a missing
# template rather than a real defect.
#
# The CSS and JS masters ship too. A tool cannot IMPORT a stylesheet — it keeps
# a copy under its own static/ — so the only way its suite can check that copy
# against the real master, in its own CI where the package comes from the
# pinned tag, is for the master to be in the wheel. See shared_assets.py, and
# server-ops/package_build_check.py, which fails if any of this is missing.
phronon_common = ["legal_templates/*.html", "*.css", "*.js"]
