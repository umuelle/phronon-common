name: CI
# Runs on every push/PR (Python 3.10, matching the server):
#   1. py_compile every tracked .py     — syntax
#   2. parse every Jinja template        — template syntax
#   3. install deps + the shared phronon_common package, then pytest
# A MySQL service runs the DB-backed tests, which must not skip here
# (PHRONON_REQUIRE_DB=1, tests/conftest.py). No secrets are needed.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    # Since 3 October 2026: a real MySQL, and PHRONON_REQUIRE_DB=1 so the
    # DB-backed tests (passkey one-use rule, once() under row locks) FAIL here
    # if they cannot run, instead of skipping as they did on every CI run.
    services:
      mysql:
        image: mysql:8.0.46   # the fleet's pinned image (see the tools' ci.yml)
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: phronon_common_test
          MYSQL_USER: phronon_common
          MYSQL_PASSWORD: ci-pass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_USER: phronon_common
      DB_PASSWORD: ci-pass
      DB_NAME: phronon_common_test
      PHRONON_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile every tracked .py (syntax)
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then python -m py_compile $files; echo "compiled OK"; else echo "no .py files"; fi
      - name: Parse every Jinja template (syntax)
        run: |
          python -m pip install --quiet jinja2
          python - <<'PY'
          import glob, sys, jinja2
          env = jinja2.Environment()
          errs = []
          for pattern in ("templates/**/*.html", "templates/**/*.txt"):
              for p in glob.glob(pattern, recursive=True):
                  try:
                      env.parse(open(p, encoding="utf-8").read())
                  except jinja2.TemplateSyntaxError as e:
                      errs.append(f"{p}:{e.lineno}: {e.message}")
          if errs:
              print("TEMPLATE SYNTAX ERRORS:"); print("\n".join(errs)); sys.exit(1)
          print("all templates parse")
          PY
      - name: Install dependencies and run the test suite
        run: |
          if [ ! -d tests ]; then echo "no tests/ directory — skipping pytest"; exit 0; fi
          python -m pip install --quiet --upgrade pip
          # Install what PRODUCTION installs (G5). The deploy installs
          # requirements.lock with --require-hashes; CI used to install
          # requirements.txt instead, so the environment the tests ran in was
          # not the environment that ships — and the audit below, which reads
          # the lock, described a set nothing here had actually installed.
          # Test-only packages come in a SECOND pip call on purpose: pip
          # applies --require-hashes per invocation, so mixing a hashed file
          # with an unhashed one in one call is refused outright.
          if [ -f requirements.lock ]; then
            pip install --quiet --require-hashes -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install --quiet -r requirements.txt
          fi
          if [ -f requirements-test.txt ]; then pip install --quiet -r requirements-test.txt; fi
          # THIS repo installs ITSELF from the checkout — never from a tag.
          # It used to `pip install phronon_common@git+...@v1.6.0`, and because
          # GitHub checks out into a directory named `phronon-common` (hyphen),
          # the tests' `sys.path.insert(parents[2])` found no `phronon_common`
          # package beside it and fell through to site-packages. So the 92 legal
          # tests were validating the published v1.6.0 while the repo was on
          # v1.8.x — green, and proving nothing about the code being pushed.
          pip install --quiet pytest
          pip install --quiet -e .
          pip install --quiet pip-audit
          # BLOCKING. This used to downgrade findings to a warning, which meant a
          # known-vulnerable package could sail through unnoticed. Audit the
          # checksum-locked graph when there is one — that is what actually gets
          # installed in production, and it covers indirect packages too.
          if [ -f requirements.lock ]; then
            pip-audit -r requirements.lock
            # requirements-test.txt is installed above, so audit it too — it was
            # previously invisible to the scan on every tool that has a lock.
            if [ -f requirements-test.txt ]; then pip-audit -r requirements-test.txt; fi
          else
            audit_args=""
            if [ -f requirements.txt ]; then audit_args="$audit_args -r requirements.txt"; fi
            if [ -f requirements-test.txt ]; then audit_args="$audit_args -r requirements-test.txt"; fi
            if [ -n "$audit_args" ]; then pip-audit $audit_args; fi
          fi
          # A skipped security test looks exactly like a passing one, so make the
          # count visible in the log and fail if the suite itself did not run.
          python -m pytest tests/ -q -ra -p no:cacheprovider
