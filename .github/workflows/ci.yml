name: CI
# Runs on every push/PR (Python 3.10, matching the server):
#   1. py_compile every tracked .py     — syntax
#   2. parse every Jinja template        — template syntax
#   3. install deps + the shared phronon_common package, then pytest
# The DB-backed and live-email tests skip automatically when no database / SMTP
# is present (as they do off-server), so no secrets or services are needed here.
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile every tracked .py (syntax)
        run: |
          files=$(git ls-files '*.py')
          if [ -n "$files" ]; then python -m py_compile $files; echo "compiled OK"; else echo "no .py files"; fi
      - name: Parse every Jinja template (syntax)
        run: |
          python -m pip install --quiet jinja2
          python - <<'PY'
          import glob, sys, jinja2
          env = jinja2.Environment()
          errs = []
          for pattern in ("templates/**/*.html", "templates/**/*.txt"):
              for p in glob.glob(pattern, recursive=True):
                  try:
                      env.parse(open(p, encoding="utf-8").read())
                  except jinja2.TemplateSyntaxError as e:
                      errs.append(f"{p}:{e.lineno}: {e.message}")
          if errs:
              print("TEMPLATE SYNTAX ERRORS:"); print("\n".join(errs)); sys.exit(1)
          print("all templates parse")
          PY
      - name: Install dependencies and run the test suite
        run: |
          if [ ! -d tests ]; then echo "no tests/ directory — skipping pytest"; exit 0; fi
          python -m pip install --quiet --upgrade pip
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install --quiet -r requirements-test.txt; fi
          pip install --quiet pytest "phronon_common @ git+https://github.com/umuelle/phronon-common.git@v1.1.0"
          pip install --quiet pip-audit
          # BLOCKING. This used to downgrade findings to a warning, which meant a
          # known-vulnerable package could sail through unnoticed. Audit the
          # checksum-locked graph when there is one — that is what actually gets
          # installed in production, and it covers indirect packages too.
          if [ -f requirements.lock ]; then
            pip-audit -r requirements.lock
          else
            audit_args=""
            if [ -f requirements.txt ]; then audit_args="$audit_args -r requirements.txt"; fi
            if [ -f requirements-test.txt ]; then audit_args="$audit_args -r requirements-test.txt"; fi
            if [ -n "$audit_args" ]; then pip-audit $audit_args; fi
          fi
          # A skipped security test looks exactly like a passing one, so make the
          # count visible in the log and fail if the suite itself did not run.
          python -m pytest tests/ -q -ra -p no:cacheprovider
